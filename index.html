<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>浮阅</title>
  </head>
  <body>
    <div id="app">
      <aside id="chrome" aria-label="工具">
        <button id="btn-open" type="button" title="打开 TXT">打开</button>
        <button id="btn-font" type="button" title="字体设置">字体</button>
        <button id="btn-hide" type="button" title="隐蔽 (⌘⇧H)">隐</button>
      </aside>

      <div id="panel" hidden>
        <label>
          字体
          <select id="font-family"></select>
        </label>
        <label>
          字号
          <input id="font-size" type="range" min="12" max="48" step="1" />
          <span id="font-size-val">18</span>
        </label>
        <label class="color-row">
          字色
          <button id="font-color" type="button" title="切换黑/白">白</button>
          <span></span>
        </label>
        <div class="recent-block">
          <div class="recent-title">最近</div>
          <ul id="recent-list"></ul>
        </div>
      </div>

      <main id="reader" tabindex="0" data-tauri-drag-region>
        <div id="placeholder" data-tauri-drag-region>打开 TXT 开始摸鱼阅读<br /><span>⌘⇧H 隐蔽 · 失焦自动隐藏</span></div>
        <article id="content" hidden data-tauri-drag-region></article>
      </main>
      <div class="resize-handle n" data-dir="North"></div>
      <div class="resize-handle s" data-dir="South"></div>
      <div class="resize-handle w" data-dir="West"></div>
      <div class="resize-handle e" data-dir="East"></div>
      <div class="resize-handle nw" data-dir="NorthWest"></div>
      <div class="resize-handle ne" data-dir="NorthEast"></div>
      <div class="resize-handle sw" data-dir="SouthWest"></div>
      <div class="resize-handle se" data-dir="SouthEast"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
